name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers automatically when you push tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # Required for creating GitHub Releases and uploading APKs

jobs:
  build-and-release:
    name: Test, Build APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Run Tests
        run: |
          flutter analyze
          flutter test
      
      - name: Decode Android Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
              python3 - << 'PYEOF'
              import base64, os

              b64 = "".join(os.environ["KEYSTORE_BASE64"].split())
              with open("android/upload-keystore.jks", "wb") as f:
                  f.write(base64.b64decode(b64))

              def esc(v: str) -> str:
                  return v.replace("\\", "\\\\")

              with open("android/key.properties", "w") as f:
                  f.write(f"storePassword={esc(os.environ['STORE_PASSWORD'])}\n")
                  f.write(f"keyPassword={esc(os.environ['KEY_PASSWORD'])}\n")
                  f.write(f"keyAlias={esc(os.environ['KEY_ALIAS'])}\n")
                  f.write(f"storeFile={os.environ['GITHUB_WORKSPACE']}/android/upload-keystore.jks\n")
              PYEOF
              keytool -list -keystore android/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Determine Version Name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version_name }}" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "vedic-math-${{ steps.meta.outputs.tag }}.apk"

      - name: Clean up sensitive keystore files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Vedic Math ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: vedic-math-${{ steps.meta.outputs.tag }}.apk
